<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the invasion escalated · Mongabay</title>
<meta name="description" content="Timeline of the 2026 invasion of the Ituna/Itatá Indigenous Territory, from the first campsite to the joint operation that dismantled it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>document.documentElement.className = "js";</script>
</head>
<body>

<figure class="tl" id="tl">

  <header class="tl-head">
    <h1 class="tl-title" id="tl-title"></h1>
    <p class="tl-deck" id="tl-deck"></p>
  </header>

  <!-- the timeline itself: one tick per card, the date printed once per day -->
  <nav class="rail" id="rail" aria-label="Timeline"></nav>

  <div class="stage" id="stage">
    <div class="row" id="row"></div>
    <button type="button" class="nav nav--prev" id="prev"></button>
    <button type="button" class="nav nav--next" id="next"></button>
  </div>

  <p class="step" id="step" aria-live="polite"></p>

  <figcaption class="tl-foot">
    <p class="tl-source" id="tl-source"></p>
  </figcaption>

  <noscript>
    <div class="tl-noscript">
      <p><strong>How the invasion escalated.</strong> Between Aug. 16 and Sept. 3, 2026, an incursion
      into the Ituna/Itatá Indigenous Territory grew from one campsite into an occupation of more
      than 500 people.</p>
      <p>This timeline needs JavaScript to show its photographs and videos.</p>
    </div>
  </noscript>

</figure>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Flip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Observer.min.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
